name: Build & Publish Docker Images

# Publishes versioned Docker images to GHCR when a release/tag is created.
# Ensures every tagged version maps to a reproducible, immutable image.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version metadata (SemVer)
        id: meta
        run: |
          # Normalize tag (e.g. v1.2.3) into image tags
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "semver=${TAG}" >> "$GITHUB_OUTPUT"
            echo "tags=${TAG},latest" >> "$GITHUB_OUTPUT"
          else
            echo "semver=${TAG}" >> "$GITHUB_OUTPUT"
            echo "tags=${TAG}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Create release tag annotation
        run: |
          echo "Published version ${{ steps.meta.outputs.version }} (from tag ${{ github.ref_name }})"
          echo "Backend:  ghcr.io/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tags }}"
          echo "Frontend: ghcr.io/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tags }}"
