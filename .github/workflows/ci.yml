name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check collabuild/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Verify wheel contents
        run: |
          python -c "
          import zipfile, sys
          z = zipfile.ZipFile('dist/*.whl'.replace('*', '\$\{ls dist/*.whl\}'))
          files = z.namelist()
          assert 'collabuild/__init__.py' in files, 'Missing __init__.py'
          assert 'collabuild/config.yaml' in files, 'Missing config.yaml'
          assert 'collabuild/web/templates/chat.html' in files, 'Missing chat.html'
          print(f'Wheel contains {len(files)} files — OK')
          "

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
